<body><p id="m">載入中…</p><script>
const get = u => fetch(u).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); });
get("https://cdn.jsdelivr.net/gh/ww8chw/group-post-plan@9d678e7d8b9f96f657cda30f7ec12a0fa26ca88d/site.dat").catch(() => get("site.dat?v=2deb4745c2"))
  .then(b => new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"))).text())
  .then(h => { document.open(); document.write(h); document.close(); })
  .catch(e => { document.getElementById("m").textContent = "載入失敗，請重新整理一次（" + e.message + "）"; });
</script></body></html>
